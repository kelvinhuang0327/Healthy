services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: healthy_test
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthy -d healthy_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
